apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: analyzer-hyperparam-sweep
  namespace: argo-analyzer
spec:
  entrypoint: pipeline
  serviceAccountName: argo
  arguments:
    parameters:
      - name: force_training
        value: "false"
      - name: validate_model
        value: "true"
      - name: test_model
        value: "true"
  volumes:
    - name: argo-analyzer-training-volume
      persistentVolumeClaim:
        claimName: argo-analyzer-training-data
    - name: argo-analyzer-validation-volume
      persistentVolumeClaim:
        claimName: argo-analyzer-validation-data
    - name: argo-analyzer-testing-volume
      persistentVolumeClaim:
        claimName: argo-analyzer-testing-data
    - name: shm-volume
      emptyDir:
        medium: Memory
  templates:
    - name: pipeline
      dag:
        tasks:
          - name: read-hyperparams
            template: read-json

          - name: sweep-trial
            template: train-eval-test
            arguments:
              parameters:
                - name: model_path
                  value: "{{item.model_path}}"
                - name: batch_size
                  value: "{{item.batch_size}}"
                - name: shuffle
                  value: "{{item.shuffle}}"
                - name: num_workers
                  value: "{{item.num_workers}}"
                - name: model_dropout
                  value: "{{item.model_dropout}}"
                - name: training_weight_decay
                  value: "{{item.training_weight_decay}}"
                - name: training_learning_rate
                  value: "{{item.training_learning_rate}}"
                - name: training_epochs
                  value: "{{item.training_epochs}}"
                - name: evaluation_threshold
                  value: "{{item.evaluation_threshold}}"
            withParam: "{{tasks.read-hyperparams.outputs.parameters.hyperparams-list}}"
            dependencies: [read-hyperparams]

    - name: train-eval-test
      inputs:
        parameters:
          - name: model_path
          - name: batch_size
          - name: shuffle
          - name: num_workers
          - name: model_dropout
          - name: training_weight_decay
          - name: training_learning_rate
          - name: training_epochs
          - name: evaluation_threshold
          - name: force_training
            value: "false"
          - name: validate_model
            value: "true"
          - name: test_model
            value: "true"
      dag:
        tasks:
          - name: check-model-exists
            template: check-model
            arguments:
              parameters:
                - name: model_path
                  value: "{{inputs.parameters.model_path}}"
                - name: force_training
                  value: "{{inputs.parameters.force_training}}"

          - name: train
            templateRef:
              name: analyzer-templates
              template: train-model
              namespace: argo-analyzer
            arguments:
              parameters:
                - name: model_path
                  value: "{{inputs.parameters.model_path}}"
                - name: batch_size
                  value: "{{inputs.parameters.batch_size}}"
                - name: shuffle
                  value: "{{inputs.parameters.shuffle}}"
                - name: num_workers
                  value: "{{inputs.parameters.num_workers}}"
                - name: model_dropout
                  value: "{{inputs.parameters.model_dropout}}"
                - name: training_weight_decay
                  value: "{{inputs.parameters.training_weight_decay}}"
                - name: training_learning_rate
                  value: "{{inputs.parameters.training_learning_rate}}"
                - name: training_epochs
                  value: "{{inputs.parameters.training_epochs}}"
            dependencies: [check-model-exists]
            when: "{{tasks.check-model-exists.outputs.parameters.should_train}} == true"

          - name: validate
            templateRef:
              name: analyzer-templates
              template: validate-model
              namespace: argo-analyzer
            arguments:
              parameters:
                - name: model_path
                  value: "{{inputs.parameters.model_path}}"
                - name: evaluation_threshold
                  value: "{{inputs.parameters.evaluation_threshold}}"
            dependencies: [train]
            when: "{{inputs.parameters.validate_model}} == true"

          - name: test
            templateRef:
              name: analyzer-templates
              template: test-model
              namespace: argo-analyzer
            arguments:
              parameters:
                - name: model_path
                  value: "{{inputs.parameters.model_path}}"
                - name: evaluation_threshold
                  value: "{{inputs.parameters.evaluation_threshold}}"
            dependencies: [train]
            when: "{{inputs.parameters.test_model}} == true"

    - name: check-model
      inputs:
        parameters:
          - name: force_training
          - name: model_path
      script:
        image: python:3.10-slim
        command: [ python ]
        volumeMounts:
          - name: argo-analyzer-training-volume
            mountPath: /mnt/data
        env:
          - name: FORCE_TRAINING
            value: "{{inputs.parameters.force_training}}"
          - name: MODEL_PATH
            value: "{{inputs.parameters.model_path}}"
        source: |
          import os
          force_training = os.getenv("FORCE_TRAINING", "false").lower() == "true"
          model_path = os.getenv("MODEL_PATH", "/mnt/data/saved_models/BinaryAlexNet/model.pt")
          should_train = force_training or not os.path.isfile(model_path)
          print("should_train =", should_train)
          with open("/tmp/output.txt", "w") as f:
              f.write(str(should_train).lower())
      outputs:
        parameters:
          - name: should_train
            valueFrom:
              path: /tmp/output.txt

    - name: read-json
      script:
        image: python:3.10-slim
        command: [ python ]
        volumeMounts:
          - name: argo-analyzer-training-volume
            mountPath: /mnt/data
        source: |
          import json
          with open("/mnt/data/hyperparams.json") as f:
              data = json.load(f)
          with open("/tmp/hyperparams.json", "w") as out:
              json.dump(data, out)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
      outputs:
        parameters:
          - name: hyperparams-list
            valueFrom:
              path: /tmp/hyperparams.json
