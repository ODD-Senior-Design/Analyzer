apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: analyzer-model-pipeline
  namespace: argo-analyzer
spec:
  entrypoint: pipeline
  arguments:
    parameters:
      - name: train_model
        value: "true"
      - name: validate_model
        value: "true"
      - name: test_model
        value: "false"

  volumes:
    - name: argo-analyzer-volume
      persistentVolumeClaim:
        claimName: argo-analyzer-data
    - name: shm-volume
      emptyDir:
        medium: Memory

  templates:
    - name: pipeline
      dag:
        tasks:
          - name: train
            templateRef:
              name: analyzer-templates
              template: train-model
              namespace: argo-analyzer
            when: "{{workflow.parameters.train_model}} == true"

          - name: validate
            templateRef:
              name: analyzer-templates
              template: validate-model
              namespace: argo-analyzer
            dependencies: [ train ]
            when: "{{workflow.parameters.validate_model}} == true"

          - name: test
            templateRef:
              name: analyzer-templates
              template: test-model
              namespace: argo-analyzer
            dependencies: [train]
            when: "{{workflow.parameters.test_model}} == true"
